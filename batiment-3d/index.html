<script>
(async function(){
const loader=document.getElementById('loader');
try{await Promise.race([Promise.all([document.fonts.load('100px Anton'),document.fonts.load('700 100px Cinzel'),document.fonts.load('600 40px Barlow')]),new Promise(r=>setTimeout(r,3000))]);}catch(e){}
await new Promise(r=>setTimeout(r,30));
try{build();}catch(e){
  loader.innerHTML='<div>IMPOSSIBLE D’AFFICHER LA 3D<small>Ton appareil ne prend pas en charge WebGL, ou une erreur est survenue : '+(e&&e.message||e)+'</small></div>';
  console.error(e);return;
}

function build(){
const H=5.2;
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
let seed=7;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rr=(a,b)=>a+(b-a)*rnd();

/* ================= moteur ================= */
const host=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.physicallyCorrectLights=false;
host.appendChild(renderer.domElement);
const ANISO=renderer.capabilities.getMaxAnisotropy();
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,0.2,1400);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=Math.PI*.488;
controls.minDistance=4;controls.maxDistance=150;controls.autoRotate=true;controls.autoRotateSpeed=.4;
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?58:45;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

/* ================= utilitaires ================= */
function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c,o={}){const t=new THREE.CanvasTexture(c);if(o.srgb!==false)t.encoding=THREE.sRGBEncoding;t.anisotropy=ANISO;
  if(o.repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(o.repeat[0],o.repeat[1]);}return t;}
function lin(g,x0,y0,x1,y1,stops){const gr=g.createLinearGradient(x0,y0,x1,y1);stops.forEach((c,i)=>gr.addColorStop(i/(stops.length-1),c));return gr;}
function rect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function gold(g,x0,y0,x1,y1){return lin(g,x0,y0,x1,y1,['#fbe7a6','#d6a242','#f6d680','#b47f2c']);}
function normalFromHeight(hc,k){const w=hc.width,h=hc.height;const s=hc.getContext('2d').getImageData(0,0,w,h).data;
  const o=cvs(w,h),og=o.getContext('2d'),img=og.createImageData(w,h),d=img.data;
  const H=(x,y)=>s[(((y+h)%h)*w+((x+w)%w))*4];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){let nx=(H(x-1,y)-H(x+1,y))/255*k,ny=(H(x,y+1)-H(x,y-1))/255*k,nz=1;
    const l=Math.hypot(nx,ny,nz);const i=(y*w+x)*4;d[i]=(nx/l*.5+.5)*255;d[i+1]=(ny/l*.5+.5)*255;d[i+2]=(nz/l*.5+.5)*255;d[i+3]=255;}
  og.putImageData(img,0,0);return o;}

function heartPath(g,cx,cy,s){g.beginPath();for(let i=0;i<=140;i++){const t=i/140*Math.PI*2;
  const x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  const px=cx+x*s/34,py=cy-y*s/34-s*.05;i?g.lineTo(px,py):g.moveTo(px,py);}g.closePath();}
function drawVMLogo(g,cx,cy,s,fillHeart=true){
  const gd=gold(g,cx-s/2,cy-s/2,cx+s/2,cy+s/2);
  g.save();g.shadowColor='rgba(255,196,100,.55)';g.shadowBlur=s*.05;
  if(fillHeart){heartPath(g,cx,cy,s);g.fillStyle='rgba(12,11,10,.9)';g.fill();}
  heartPath(g,cx,cy,s);g.lineWidth=s*.035;g.strokeStyle=gd;g.stroke();
  heartPath(g,cx,cy,s*.86);g.lineWidth=s*.01;g.stroke();
  g.fillStyle=gd;const R=s*.6;
  for(const side of [-1,1])for(let i=0;i<9;i++){const a=(102+i*13)*Math.PI/180;
    const x=cx-side*R*Math.cos(a),y=cy+s*.04+R*Math.sin(a);
    for(const k of [-1,1]){g.save();g.translate(x,y);g.rotate((side<0?a:Math.PI-a)+Math.PI/2+k*.55*side);
      g.beginPath();g.ellipse(0,-s*.03,s*.05,s*.019,Math.PI/2,0,Math.PI*2);g.fill();g.restore();}}
  const cyC=cy-s*.43;g.beginPath();
  [[-.13,0],[-.14,-.1],[-.07,-.045],[0,-.14],[.07,-.045],[.14,-.1],[.13,0]].forEach((p,i)=>{const x=cx+p[0]*s,y=cyC+p[1]*s;i?g.lineTo(x,y):g.moveTo(x,y);});g.closePath();g.fill();
  [[-.14,-.1],[0,-.14],[.14,-.1]].forEach(p=>{g.beginPath();g.arc(cx+p[0]*s,cyC+p[1]*s,s*.018,0,7);g.fill();});
  g.font=`700 ${Math.round(s*.29)}px Cinzel, Georgia, serif`;g.textAlign='center';g.textBaseline='middle';g.fillText('VM',cx,cy+s*.02);
  g.restore();
}

/* ================= ciel + environnement (reflets du verre) ================= */
function skyCanvas(night){
  const c=cvs(2048,1024),g=c.getContext('2d');
  g.fillStyle=lin(g,0,0,0,512,night?['#07112b','#1a2c63','#4a4f8a','#f0a067']:['#0f4fc9','#2a73e0','#5ea2ee','#c7e2fb']);
  g.fillRect(0,0,2048,512);g.fillStyle=night?'#2a2638':'#cfe0ee';g.fillRect(0,512,2048,512);
  seed=21;const col=night?'255,180,150':'255,255,255';
  for(let i=0;i<9000;i++){const y=Math.pow(rnd(),.9)*440+40,x=rnd()*2048;
    const band=Math.sin(x*.004+y*.02)+Math.sin(x*.0013-y*.011);if(band<-.2&&rnd()<.75)continue;
    const k=.25+y/520,r=rr(2.2,5.2)*k;const gr=g.createRadialGradient(x,y-r*.3,0,x,y,r);
    gr.addColorStop(0,`rgba(${col},${night?.6:1})`);gr.addColorStop(.55,`rgba(${col},${night?.45:.92})`);
    gr.addColorStop(.8,`rgba(${night?'120,110,150':'190,210,235'},.5)`);gr.addColorStop(1,`rgba(${col},0)`);
    g.fillStyle=gr;g.beginPath();g.ellipse(x,y,r*1.6,r,0,0,7);g.fill();}
  return tex(c);
}
const skyDay=skyCanvas(false),skyNight=skyCanvas(true);
const skyMat=new THREE.MeshBasicMaterial({map:skyDay,side:THREE.BackSide,fog:false,depthWrite:false});
const skyGeo=new THREE.SphereGeometry(600,48,24);
scene.add(new THREE.Mesh(skyGeo,skyMat));
const pmrem=new THREE.PMREMGenerator(renderer);
function envFrom(map){const s=new THREE.Scene();s.add(new THREE.Mesh(skyGeo,new THREE.MeshBasicMaterial({map,side:THREE.BackSide})));
  const g=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshBasicMaterial({color:0x2a2a2a}));g.rotation.x=-Math.PI/2;g.position.y=-2;s.add(g);
  return pmrem.fromScene(s,.02).texture;}
const envDay=envFrom(skyDay),envNight=envFrom(skyNight);
scene.environment=envDay;
scene.fog=new THREE.Fog(0xcfe2f4,130,440);

/* ================= lumières ================= */
const hemi=new THREE.HemisphereLight(0xd8e9ff,0x3a3836,.35);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d8,1.7);sun.position.set(35,55,32);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-55,right:55,top:55,bottom:-55,near:1,far:220});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;scene.add(sun);scene.add(sun.target);

const glowC=cvs(128,128),gg=glowC.getContext('2d');
const grd=gg.createRadialGradient(64,64,0,64,64,64);grd.addColorStop(0,'rgba(255,232,185,1)');grd.addColorStop(.22,'rgba(255,190,110,.5)');grd.addColorStop(1,'rgba(255,170,80,0)');
gg.fillStyle=grd;gg.fillRect(0,0,128,128);
const glowMat=new THREE.SpriteMaterial({map:tex(glowC),color:0xffd59a,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.65});
function glow(x,y,z,s,parent){const sp=new THREE.Sprite(glowMat);sp.position.set(x,y,z);sp.scale.set(s,s,s);(parent||scene).add(sp);return sp;}

/* ================= végétation réaliste (cartes croisées) ================= */
function cardGeo(w,h,n,y0=0){const pos=[],uv=[],nor=[],idx=[];
  for(let k=0;k<n;k++){const a=k*Math.PI/n,c=Math.cos(a),s=Math.sin(a),b=pos.length/3;
    [[-.5,0],[.5,0],[.5,1],[-.5,1]].forEach(([u,v])=>{pos.push(u*w*c,y0+v*h,u*w*s);uv.push(u+.5,v);nor.push(0,1,0);});
    idx.push(b,b+1,b+2,b,b+2,b+3,b,b+2,b+1,b,b+3,b+2);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));g.setIndex(idx);return g;}
function foliageMat(c){const t=tex(c);const m=new THREE.MeshStandardMaterial({map:t,alphaTest:.42,side:THREE.FrontSide,roughness:.92,metalness:0});
  const d=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:t,alphaTest:.42});return {m,d};}
const LEAF=['#1f4a1f','#2b5e27','#376f2e','#44803a','#558f45','#6aa055'];
function leafColor(light){const i=Math.max(0,Math.min(LEAF.length-1,Math.round(light*(LEAF.length-1)+rr(-1,1))));return LEAF[i];}
// buisson (option fleurs)
function bushCanvas(flower){const W=512,c=cvs(W,W),g=c.getContext('2d');seed=flower?(flower.length*31):5;
  for(let i=0;i<9000;i++){const a=rnd()*Math.PI,rad=Math.sqrt(rnd());const x=W/2+Math.cos(a)*rad*W*.47,y=W*.98-Math.sin(a)*rad*W*.82;
    const light=(1-(y/W))*.75+(x<W/2?.15:0)+rr(-.15,.15);g.fillStyle=leafColor(light);
    g.save();g.translate(x,y);g.rotate(rnd()*7);g.beginPath();g.ellipse(0,0,rr(5,9),rr(2.4,4),0,0,7);g.fill();g.restore();}
  if(flower){for(let i=0;i<520;i++){const a=rnd()*Math.PI,rad=Math.pow(rnd(),.6);const x=W/2+Math.cos(a)*rad*W*.44,y=W*.95-Math.sin(a)*rad*W*.78;
    if(rnd()<.35&&y>W*.7)continue;const r=rr(5,9),light=(1-y/W)*.6+.4;
    for(let p=0;p<5;p++){const pa=p/5*Math.PI*2+rnd();g.fillStyle=shade(flower,light*rr(.75,1.05));g.beginPath();g.ellipse(x+Math.cos(pa)*r*.55,y+Math.sin(pa)*r*.55,r*.55,r*.38,pa,0,7);g.fill();}
    g.fillStyle=flower==='#f4f2ec'?'#e8c23a':'#5a1010';g.beginPath();g.arc(x,y,r*.22,0,7);g.fill();}}
  return c;}
function shade(hex,k){const n=parseInt(hex.slice(1),16);const r=Math.min(255,((n>>16)&255)*k)|0,g=Math.min(255,((n>>8)&255)*k)|0,b=Math.min(255,(n&255)*k)|0;return`rgb(${r},${g},${b})`;}
// arbre feuillu
function treeCanvas(v){const W=512,c=cvs(W,W),g=c.getContext('2d');seed=40+v;
  g.strokeStyle='#4a3626';g.lineCap='round';
  const branch=(x,y,a,len,w)=>{if(len<14)return;const x2=x+Math.cos(a)*len,y2=y-Math.sin(a)*len;g.lineWidth=w;g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke();
    branch(x2,y2,a+rr(.25,.6),len*.7,w*.65);branch(x2,y2,a-rr(.25,.6),len*.7,w*.65);};
  branch(W/2,W,Math.PI/2,W*.26,18);
  const blobs=[];for(let i=0;i<14;i++)blobs.push([W/2+rr(-.3,.3)*W,W*.42+rr(-.27,.2)*W,rr(.1,.17)*W]);
  for(const [bx,by,br] of blobs)for(let i=0;i<700;i++){const a=rnd()*7,rad=Math.sqrt(rnd())*br;const x=bx+Math.cos(a)*rad,y=by+Math.sin(a)*rad*.85;
    const light=(1-y/W)*.6+((bx+Math.cos(a)*rad-bx)<0?.2:0)+(Math.sin(a)<0?.15:-.1)+rr(-.15,.1);g.fillStyle=leafColor(light);
    g.save();g.translate(x,y);g.rotate(rnd()*7);g.beginPath();g.ellipse(0,0,rr(5,8),rr(2.6,4),0,0,7);g.fill();g.restore();}
  return c;}
// sapin
function pineCanvas(){const W=256,Hh=512,c=cvs(W,Hh),g=c.getContext('2d');seed=77;
  g.fillStyle='#3a2a1e';g.fillRect(W/2-5,Hh*.85,10,Hh*.15);
  for(let y=Hh*.03;y<Hh*.9;y+=2){const t=(y-Hh*.03)/(Hh*.87);const half=W*.47*Math.pow(t,.9)*(.85+.15*Math.sin(y*.2));
    for(let k=0;k<3;k++){const side=rnd()<.5?-1:1;const len=half*rr(.5,1);const x2=W/2+side*len,y2=y+len*.35;
      g.strokeStyle=['#16351c','#1d4423','#25522b','#2f6234'][Math.min(3,(rr(0,3)+(side<0?1:0))|0)];g.lineWidth=rr(1.5,3);
      g.beginPath();g.moveTo(W/2,y);g.quadraticCurveTo((W/2+x2)/2,y+len*.05,x2,y2);g.stroke();}}
  return c;}

  const wg=new THREE.CylinderGeometry(.34,.34,.24,18),wm=new THREE.MeshStandardMaterial({color:0x111111,roughness:.8});
  [[-.88,1.45],[.88,1.45],[-.88,-1.45],[.88,-1.45]].forEach(([wx,wz])=>{const w=new THREE.Mesh(wg,wm);w.rotation.z=Math.PI/2;w.position.set(wx,.34,wz);g.add(w);});
  g.traverse(o=>{if(o.isMesh)o.castShadow=true;});g.position.set(x,.02,z);g.rotation.y=ry;scene.add(g);}

const VIEWS={
  trois:{p:[-33,7,43],t:[-4,2.6,4]},
  avant:{p:[0,3,60],t:[0,3.6,14]},
  vm:{p:[13,2.2,27],t:[15,2.4,13]},
  resto:{p:[-50,3.4,-6],t:[-18,2.8,-6]},
  bureaux:{p:[50,3.4,-6],t:[18,2.8,-6]},
  arriere:{p:[14,8,-47],t:[0,2.4,-12]},
  dessus:{p:[0,80,6],t:[0,0,2]},
};
camera.position.set(...VIEWS.trois.p);controls.target.set(...VIEWS.trois.t);controls.update();
let tween=null;
function goTo(name){const v=VIEWS[name];tween={t0:performance.now(),d:1300,fp:camera.position.clone(),ft:controls.target.clone(),tp:V3(...v.p),tt:V3(...v.t)};controls.autoRotate=false;}
controls.addEventListener('start',()=>{controls.autoRotate=false;tween=null;});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));goTo(b.dataset.view);}));
let night=false;const modeBtn=document.getElementById('v-mode');
function setMode(n){night=n;
  skyMat.map=n?skyNight:skyDay;skyMat.needsUpdate=true;scene.environment=n?envNight:envDay;
  scene.fog.color.setHex(n?0x2c2f4c:0xcfe2f4);
  hemi.color.setHex(n?0x4a5d96:0xd8e9ff);hemi.intensity=n?.35:.35;
  sun.color.setHex(n?0x9fb3ff:0xfff0d8);sun.intensity=n?.3:1.7;sun.position.set(n?-30:35,n?40:55,n?24:32);
  renderer.toneMappingExposure=n?1.25:1.0;
  wallMats.forEach(m=>m.emissiveIntensity=n?1.2:.7);
  signMats.forEach(m=>m.emissiveIntensity=n?1.0:.6);
  interiorMats.forEach(m=>m.emissiveIntensity=m.userData.k*(n?1.5:1));
  glowMat.opacity=n?1:.65;
  modeBtn.textContent=n?'Journée':'Soirée';modeBtn.setAttribute('aria-pressed',n?'true':'false');}
modeBtn.addEventListener('click',()=>setMode(!night));
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce)controls.autoRotate=false;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function loop(now){
  if(tween){const k=Math.min(1,(now-tween.t0)/(reduce?1:tween.d));const e=ease(k);
    camera.position.lerpVectors(tween.fp,tween.tp,e);controls.target.lerpVectors(tween.ft,tween.tt,e);if(k>=1)tween=null;}
  controls.update();renderer.render(scene,camera);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
loader.hidden=true;
}
